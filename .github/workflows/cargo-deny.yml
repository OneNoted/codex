name: cargo-deny

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cargo-deny:
    runs-on: ${{ github.repository == 'OneNoted/codex' && 'apollo-codex' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0

      - name: Install cargo-deny
        if: github.repository == 'OneNoted/codex'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/cargo-deny-0.19.0-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 cargo-deny-0.19.0-x86_64-unknown-linux-musl/cargo-deny

      - name: Run cargo-deny
        if: github.repository == 'OneNoted/codex'
        run: cargo deny --manifest-path Cargo.toml check

      - name: Run cargo-deny
        if: github.repository != 'OneNoted/codex'
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.93.0
          manifest-path: ./codex-rs/Cargo.toml
